app:
  name: "InsightLens"
  env: "dev"           
  default_lang: "pt"       
  timezone: "Europe/Lisbon"

paths:
  data_dir: "data"
  raw_dir: "data/raw"
  interim_dir: "data/interim"
  processed_dir: "data/processed"
  logs_dir: "logs"

ui:
  default_theme: "light"   
  max_rows_preview: 1000

analysis:
  default_date_column: "created_at"
  default_text_column: "text"
  default_id_column: "id"
